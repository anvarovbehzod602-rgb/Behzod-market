
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14532d">
<title>Behzod Market</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f3;color:#17251b;font-family:Arial,sans-serif}
header{background:#14532d;color:white;padding:20px}
header h2{margin:0 0 5px}
header p{margin:0;font-size:13px}
main{max-width:750px;margin:auto;padding:14px}
button,input{font:inherit}
button{border:0;border-radius:10px;padding:11px 13px;background:#166534;color:white;cursor:pointer}
button:disabled{opacity:.5}
input[type=search]{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.category{background:white;color:#17251b;border:1px solid #e1e9e2;padding:17px 7px;min-height:94px;font-weight:bold}
.category span{display:block;font-size:25px;margin-bottom:7px}
.panel{background:white;padding:14px;border-radius:14px;margin:12px 0}
.hidden{display:none!important}
.back{background:#475569;margin-bottom:12px}
.product{background:white;border-radius:13px;padding:10px;margin:10px 0;display:flex;gap:11px;align-items:center}
.product img{width:85px;height:85px;object-fit:cover;border-radius:9px}
.product-info{flex:1;min-width:0}
.product-info b{display:block;overflow-wrap:anywhere}
.small{font-size:12px;color:#68756b;margin:5px 0}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.actions button{font-size:12px;padding:8px}
.red{background:#b91c1c}
.grey{background:#475569}
.empty{text-align:center;color:#66736a;padding:25px}
h3{margin:12px 0}
.topbuttons{display:flex;gap:8px;flex-wrap:wrap}
.topbuttons button{flex:1}
#photo{display:none}
.notice{background:#fff7d6;border:1px solid #f1d98a;padding:12px;border-radius:10px;margin:10px 0;font-size:13px}
.status{font-size:13px;color:#166534;padding:8px 0}
</style>
</head>
<body>
<header>
<h2>🛍 Behzod Market</h2>
<p>Mahsulotlar aqlli foto katalogi</p>
</header>

<main>
<section id="home">
<input type="search" id="search" placeholder="🔍 Bo‘lim yoki mahsulot qidirish">
<div class="grid" id="categories"></div>
<div class="panel topbuttons">
<button onclick="showOut()">🧺 Tugaganlar</button>
<button onclick="showBackup()">💾 Zaxira nusxa</button>
</div>
</section>

<section id="inside" class="hidden">
<button class="back" onclick="goHome()">← Orqaga</button>
<h3 id="catTitle"></h3>
<div class="panel">
<button onclick="document.getElementById('photo').click()">📷 Surat qo‘shish</button>
<input type="file" id="photo" accept="image/*" capture="environment">
<p class="small">Kamera yoki galereyadan surat tanlang. Nom va narx yozish shart emas.</p>
<div id="uploadStatus" class="status"></div>
</div>
<div id="products"></div>
</section>

<section id="out" class="hidden">
<button class="back" onclick="goHome()">← Orqaga</button>
<h3>🧺 Tugagan mahsulotlar</h3>
<div id="outList"></div>
</section>

<section id="backup" class="hidden">
<button class="back" onclick="goHome()">← Orqaga</button>
<h3>💾 Zaxira nusxa</h3>
<div class="panel">
<p>Mahsulotlar va suratlarni faylga saqlash yoki avvalgi nusxani tiklash.</p>
<button onclick="exportBackup()">Zaxira nusxasini yuklab olish</button>
<hr>
<p class="small">Avvalgi zaxira JSON faylini tanlang:</p>
<input type="file" id="restoreFile" accept=".json,application/json">
</div>
</section>
</main>

<script>
"use strict";

const names=[
"Konstovar","O‘yinchoqlar","Parfyumeriya","Shampun va sovunlar",
"Aksessuarlar","Chevarchilik mahsulotlari","Zakolkalar","Paypoqlar",
"Komplektlar","Ro‘mollar","Sovg‘alar","Ko‘rmana narsalar",
"Xo‘jalik mahsulotlari","Plastmassa va bir martalik idishlar",
"Remenlar","Salafan va sumkalar","Sovg‘a o‘rash mahsulotlari",
"Uy-ro‘zg‘or buyumlari, asboblar va elektr jihozlari",
"To‘r va pishiriq mahsulotlari","Tug‘ilgan kun va bayram buyumlari",
"Ziravorlar","Gullar va tuvak gullar","Hushbo‘ylantiruvchilar",
"Paynet","Pamperslar"
];

const emojis=[
"✏️","🧸","🌸","🧴","💍","🧵","🎀","🧦","👕","🧕",
"🎁","🎀","🧹","🥤","👖","🛍️","🎀","🏠","🍰","🎉",
"🌶️","🌷","🌺","📱","🍼"
];

const BACKEND_URL="https://script.google.com/macros/s/AKfycbzk2hWITuTcoiZee44DQfzE-XLqY9DgOgMQ8RQ6rfuDCAY_2Yex3SmQG3IcD-WdM-sF/exec";

const $=id=>document.getElementById(id);
let db=null;
let current="";
let products=[];

const request=indexedDB.open("BehzodMarketDB",1);

request.onupgradeneeded=e=>{
 const d=e.target.result;
 if(!d.objectStoreNames.contains("products")){
  d.createObjectStore("products",{keyPath:"id"});
 }
};

request.onsuccess=async e=>{
 db=e.target.result;
 try{
  await migrateOldData();
  await refresh();
  drawCats();
 }catch(err){
  alert("Ma’lumotlarni ochishda xatolik: "+err.message);
 }
};

request.onerror=()=>{
 alert("Saqlash bazasi ochilmadi. Brauzer ma’lumotlarini o‘chirmang.");
};

function store(mode="readonly"){
 if(!db)throw new Error("Ma’lumotlar bazasi hali tayyor emas");
 return db.transaction("products",mode).objectStore("products");
}

function getAll(){
 return new Promise((resolve,reject)=>{
  const r=store().getAll();
  r.onsuccess=()=>resolve(r.result||[]);
  r.onerror=()=>reject(r.error);
 });
}

function put(p){
 return new Promise((resolve,reject)=>{
  const r=store("readwrite").put(p);
  r.onsuccess=()=>resolve();
  r.onerror=()=>reject(r.error);
 });
}

function remove(id){
 return new Promise((resolve,reject)=>{
  const r=store("readwrite").delete(id);
  r.onsuccess=()=>resolve();
  r.onerror=()=>reject(r.error);
 });
}

async function refresh(){
 products=await getAll();
}

async function migrateOldData(){
 try{
  if(localStorage.getItem("behzod-migrated-v2"))return;

  const old=JSON.parse(localStorage.getItem("behzod-products")||"[]");
  const existing=await getAll();

  if(existing.length===0&&old.length){
   for(const p of old){
    if(p.img){
     await put({
      id:p.id||Date.now()+Math.random(),
      cat:p.cat||names[0],
      name:p.name||"Mahsulot",
      img:p.img,
      out:!!p.out,
      feature:p.feature||null
     });
    }
   }
  }

  localStorage.setItem("behzod-migrated-v2","yes");
 }catch(e){
  alert("Eski ma’lumotlarni ko‘chirishda muammo bo‘ldi. Eski ma’lumotlarni o‘chirmang.");
 }
}

function hideAll(){
 ["home","inside","out","backup"].forEach(id=>{
  $(id).classList.add("hidden");
 });
}

function goHome(){
 hideAll();
 $("home").classList.remove("hidden");
 drawCats($("search").value);
}

function drawCats(filter=""){
 const el=$("categories");
 el.innerHTML="";

 names.forEach((n,i)=>{
  if(n.toLowerCase().includes(filter.toLowerCase())){
   const b=document.createElement("button");
   b.className="category";
   const icon=document.createElement("span");
   icon.textContent=emojis[i];
   b.append(icon,document.createTextNode(n));
   b.onclick=()=>openCat(n);
   el.append(b);
  }
 });
}

function openCat(n){
 current=n;
 hideAll();
 $("inside").classList.remove("hidden");
 $("catTitle").textContent=n;
 drawProducts();
}

function makeProduct(p,container,mode){
 const d=document.createElement("div");
 d.className="product";

 const img=document.createElement("img");
 img.src=p.img;
 img.alt=p.name||"Mahsulot";

 const info=document.createElement("div");
 info.className="product-info";

 const title=document.createElement("b");
 title.textContent=p.name||"Mahsulot";

 const cat=document.createElement("div");
 cat.className="small";
 cat.textContent=p.cat||"";

 const actions=document.createElement("div");
 actions.className="actions";

 if(mode==="out"){
  const back=document.createElement("button");
  back.textContent="Qayta keldi";
  back.onclick=async()=>{
   p.out=false;
   await put(p);
   await showOut();
  };
  actions.append(back);
 }else{
  const done=document.createElement("button");
  done.textContent="Tugadi";
  done.onclick=async()=>{
   p.out=true;
   await put(p);
   await drawProducts();
  };
  actions.append(done);
 }

 const del=document.createElement("button");
 del.className="red";
 del.textContent="O‘chirish";
 del.onclick=async()=>{
  if(confirm("Mahsulotni butunlay o‘chirasizmi?")){
   await remove(p.id);
   if(mode==="out")await showOut();
   else await drawProducts();
  }
 };

 actions.append(del);
 info.append(title,cat,actions);
 d.append(img,info);
 container.append(d);
}

async function drawProducts(){
 await refresh();
 const el=$("products");
 el.innerHTML="";

 const list=products.filter(p=>p.cat===current&&!p.out);
 list.forEach(p=>makeProduct(p,el,"in"));

 if(!list.length){
  el.innerHTML='<div class="empty">Bu bo‘limda mahsulot yo‘q.</div>';
 }
}

async function showOut(){
 hideAll();
 $("out").classList.remove("hidden");
 await refresh();

 const el=$("outList");
 el.innerHTML="";

 const list=products.filter(p=>p.out);
 list.forEach(p=>makeProduct(p,el,"out"));

 if(!list.length){
  el.innerHTML='<div class="empty">Tugagan mahsulot yo‘q.</div>';
 }
}

function imageFeature(data){
 return new Promise(resolve=>{
  const im=new Image();

  im.onload=()=>{
   const c=document.createElement("canvas");
   c.width=12;
   c.height=12;

   const ctx=c.getContext("2d");
   ctx.drawImage(im,0,0,12,12);

   const px=ctx.getImageData(0,0,12,12).data;
   const a=[];

   for(let i=0;i<px.length;i+=4){
    a.push(px[i]/255,px[i+1]/255,px[i+2]/255);
   }

   resolve(a);
  };

  im.onerror=()=>resolve([]);
  im.src=data;
 });
}

function similarity(a,b){
 if(!a||!b||a.length!==b.length||!a.length)return 0;

 let sum=0;
 for(let i=0;i<a.length;i++){
  sum+=Math.abs(a[i]-b[i]);
 }

 return 1-sum/a.length;
}

function resize(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();

  reader.onload=e=>{
   const im=new Image();

   im.onload=()=>{
    const c=document.createElement("canvas");
    const scale=Math.min(1,1000/Math.max(im.width,im.height));

    c.width=Math.round(im.width*scale);
    c.height=Math.round(im.height*scale);

    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    resolve(c.toDataURL("image/jpeg",.78));
   };

   im.onerror=reject;
   im.src=e.target.result;
  };

  reader.onerror=reject;
  reader.readAsDataURL(file);
 });
}

async function analyzeWithGemini(data){
 const response=await fetch(BACKEND_URL,{
  method:"POST",
  headers:{
   "Content-Type":"text/plain;charset=utf-8"
  },
  body:JSON.stringify({
   imageBase64:data,
   mimeType:"image/jpeg"
  })
 });

 const result=JSON.parse(await response.text());

 if(!result.ok){
  throw new Error(result.error||"Gemini xatosi");
 }

 return result.analysis||"Mahsulot tahlil qilindi.";
}

$("photo").onchange=async()=>{
 const file=$("photo").files[0];
 if(!file)return;

 const status=$("uploadStatus");
 status.textContent="Surat tayyorlanmoqda...";

 try{
  const data=await resize(file);
  const feature=await imageFeature(data);

  await refresh();

  let best=0;
  let bestProduct=null;

  for(const p of products){
   if(p.cat!==current)continue;

   const oldFeature=p.feature||await imageFeature(p.img);
   const score=similarity(feature,oldFeature);

   if(score>best){
    best=score;
    bestProduct=p;
   }
  }

  if(best>.91&&bestProduct){
   const yes=confirm(
    "Diqqat! Bu bo‘limda o‘xshash surat mavjud. Baribir qo‘shasizmi?"
   );

   if(!yes){
    status.textContent="";
    $("photo").value="";
    return;
   }
  }

  status.textContent="Gemini mahsulotni tahlil qilmoqda...";

  let aiAnalysis="";

  try{
   aiAnalysis=await analyzeWithGemini(data);
  }catch(aiError){
   const yes=confirm(
    "Gemini bilan aloqa bo‘lmadi: "+aiError.message+
    "\n\nSuratni AI-siz saqlaymizmi?"
   );

   if(!yes){
    status.textContent="";
    $("photo").value="";
    return;
   }
  }

  await put({
   id:Date.now()+Math.random(),
   cat:current,
   name:aiAnalysis?aiAnalysis.split("\n")[0].slice(0,70):"Mahsulot",
   aiAnalysis:aiAnalysis,
   img:data,
   feature:feature,
   out:false
  });

  await drawProducts();

  status.textContent="";

  if(aiAnalysis){
   alert("Gemini tahlili:\n\n"+aiAnalysis+"\n\nMahsulot saqlandi!");
  }else{
   alert("Mahsulot AI-siz saqlandi.");
  }

 }catch(e){
  alert("Suratni qo‘shishda xatolik: "+e.message);
  status.textContent="";
 }

 $("photo").value="";
};

$("search").oninput=async()=>{
 const q=$("search").value.toLowerCase().trim();

 if(!q){
  drawCats();
  return;
 }

 await refresh();

 const matching=products.filter(p=>
  (p.cat||"").toLowerCase().includes(q)||
  (p.name||"").toLowerCase().includes(q)||
  (p.aiAnalysis||"").toLowerCase().includes(q)
 );

 const el=$("categories");
 el.innerHTML="";

 matching.forEach(p=>{
  const b=document.createElement("button");
  b.className="category";
  b.textContent="📦 "+p.cat+" — "+(p.name||"Mahsulot");
  b.onclick=()=>openCat(p.cat);
  el.append(b);
 });

 if(!matching.length){
  drawCats(q);
 }
};

function showBackup(){
 hideAll();
 $("backup").classList.remove("hidden");
}

async function exportBackup(){
 try{
  await refresh();

  const blob=new Blob([JSON.stringify({
   app:"Behzod Market",
   version:2,
   products:products
  })],{type:"application/json"});

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download="BehzodMarket_zaxira.json";
  a.click();

  setTimeout(()=>URL.revokeObjectURL(url),3000);
 }catch(e){
  alert("Zaxira nusxasini yaratib bo‘lmadi: "+e.message);
 }
}

$("restoreFile").onchange=async()=>{
 const file=$("restoreFile").files[0];
 if(!file)return;

 try{
  const data=JSON.parse(await file.text());

  if(!Array.isArray(data.products)){
   throw new Error("Zaxira fayli noto‘g‘ri");
  }

  if(!confirm("Zaxiradagi mahsulotlar mavjud mahsulotlarga qo‘shilsinmi?")){
   $("restoreFile").value="";
   return;
  }

  for(const p of data.products){
   if(p.img){
    await put({
     ...p,
     id:Date.now()+Math.random()
    });
   }
  }

  await refresh();
  alert("Zaxira nusxasi tiklandi.");

 }catch(e){
  alert("Zaxira faylini tiklashda xatolik: "+e.message);
 }

 $("restoreFile").value="";
};
</script>
</body>
</html>
